version: '3.8'

services:
  yolo-world-large:
    build:
      context: .
      dockerfile: Dockerfile
    image: yolo-world-large:latest
    container_name: yolo-world-large
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - YOLO_MODEL_NAME=yolov8l-worldv2.pt
      - YOLO_DEVICE=cuda
      - PORT=8005
      - HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
